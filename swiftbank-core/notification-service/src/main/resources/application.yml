spring:
  application:
   name: notification-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  mail:
   host: ${SPRING_MAIL_HOST}
   port: ${SPRING_MAIL_PORT}
   username: ${SPRING_MAIL_USERNAME}
   password: ${SPRING_MAIL_PASSWORD}
   properties:
    mail:
     smtp:
       auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
       starttls:
        enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

notification:
  from: ${NOTIFICATION_FROM}
  subject: ${NOTIFICATION_SUBJECT}
  link-en: ${NOTIFICATION_LINK_EN}
  link-ua: ${NOTIFICATION_LINK_UA}

ttl:
  minutes: ${REDIS_TTL_MINUTES}

server:
  port: ${NOTIFY_SERVER_PORT}
