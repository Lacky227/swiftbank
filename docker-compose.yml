version: '3.8'

services:
  #########################################
  # Infrastructure Services
  #########################################
  
  postgres:
    image: postgres:17-alpine
    container_name: swiftbank-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - swiftbank-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${DB_AUTH},${DB_ACCOUNT},${DB_CARD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiftbank-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - swiftbank-network
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: swiftbank-redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    networks:
      - swiftbank-network
    environment:
      REDIS_HOSTS: local:${REDIS_HOST}:${REDIS_PORT}:0:${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftbank-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - swiftbank-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  #########################################
  # Service Discovery
  #########################################
  
  registry-service:
    build:
      context: ./swiftbank-core/registry-service
      dockerfile: Dockerfile
    container_name: swiftbank-registry
    restart: unless-stopped
    ports:
      - "${PORT_REGISTRY}:${PORT_REGISTRY}"
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_REGISTRY}
      EUREKA_REGISTER_WITH_EUREKA: ${EUREKA_REGISTER_WITH_EUREKA}
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY}
      EUREKA_ENABLE_SELF_PRESERVATION: ${EUREKA_ENABLE_SELF_PRESERVATION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT_REGISTRY}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  #########################################
  # API Gateway
  #########################################
  
  api-gateway:
    build:
      context: ./swiftbank-core/api-gateway
      dockerfile: Dockerfile
    container_name: swiftbank-gateway
    restart: unless-stopped
    depends_on:
      registry-service:
        condition: service_healthy
    ports:
      - "${PORT_GATEWAY}:${PORT_GATEWAY}"
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_GATEWAY}
      EUREKA_CLIENT_SERVICE_URL: ${EUREKA_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

  #########################################
  # Business Services
  #########################################
  
  auth-service:
    build:
      context: ./swiftbank-core/auth-service
      dockerfile: Dockerfile
    container_name: swiftbank-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_AUTH}

      DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_AUTH}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      EUREKA_CLIENT_SERVICE_URL: ${EUREKA_URL}

  account-service:
    build:
      context: ./swiftbank-core/account-service
      dockerfile: Dockerfile
    container_name: swiftbank-account
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_ACCOUNT}

      DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_ACCOUNT}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      COUNTRY_CODE: ${ACCOUNT_COUNTRY_CODE}
      BANK_CODE: ${ACCOUNT_BANK_CODE}

      EUREKA_CLIENT_SERVICE_URL: ${EUREKA_URL}

  card-service:
    build:
      context: ./swiftbank-core/card-service
      dockerfile: Dockerfile
    container_name: swiftbank-card
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_CARD}

      DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_CARD}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      EUREKA_CLIENT_SERVICE_URL: ${EUREKA_URL}

  notification-service:
    build:
      context: ./swiftbank-core/notification-service
      dockerfile: Dockerfile
    container_name: swiftbank-notification
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - swiftbank-network
    environment:
      SERVER_PORT: ${PORT_NOTIFICATION}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_SMTP_AUTH: ${EMAIL_SMTP_AUTH}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS}

      RESET_PASSWORD_SUBJECT: ${RESET_PASSWORD_SUBJECT}
      RESET_PASSWORD_LINK_EN: ${RESET_PASSWORD_LINK_EN}
      RESET_PASSWORD_LINK_UA: ${RESET_PASSWORD_LINK_UA}
      RESET_TOKEN_TTL_MINUTES: ${RESET_TOKEN_TTL_MINUTES}

#########################################
# Volumes
#########################################
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

#########################################
# Networks
#########################################
networks:
  swiftbank-network:
    driver: bridge
    name: swiftbank-network