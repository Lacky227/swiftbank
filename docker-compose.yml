services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - swiftbank-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - swiftbank-network
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
    networks:
      - swiftbank-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always


  registry-service:
    build:
      context: ./swiftbank-core/registry-service
      dockerfile: Dockerfile
    container_name: registry-service
    ports:
      - "8761:8761"
    networks:
      - swiftbank-network
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY}
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: ${EUREKA_SERVER_ENABLE_SELF_PRESERVATION}
      REGISTRY_SERVER_PORT: ${REGISTRY_SERVER_PORT}
    restart: always

  api-gateway:
    build:
      context: ./swiftbank-core/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - registry-service
    networks:
      - swiftbank-network
    ports:
      - "8080:8080"
    environment:
      GATEWAY_SERVER_PORT: ${GATEWAY_SERVER_PORT}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
    restart: always

  auth-service:
    build:
      context: ./swiftbank-core/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      - postgres
      - registry-service
    networks:
      - swiftbank-network
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT}
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
    restart: always

  notification-service:
    build:
      context: ./swiftbank-core/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      - redis
    networks:
      - swiftbank-network
    ports:
      - "${NOTIFY_SERVER_PORT}:${NOTIFY_SERVER_PORT}"
    environment:
      SERVER_PORT: ${NOTIFY_SERVER_PORT}
      SPRING_APPLICATION_NAME: notification-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM}
      NOTIFICATION_SUBJECT: ${NOTIFICATION_SUBJECT}
      NOTIFICATION_LINK: ${NOTIFICATION_LINK}
      REDIS_TTL_MINUTES: ${REDIS_TTL_MINUTES}
    restart: always

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:

networks:
  swiftbank-network:
    driver: bridge